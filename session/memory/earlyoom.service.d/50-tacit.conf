# Tacit: earlyoom on every computer, as on the Book4 (whose device package's tacit-book4.conf sorts after this one and
# wins there). Without it a full memory froze the whole screen for minutes before the kernel's own killer acted
# (Discord 2026-11-02/03: the desktop stopped answering; a wallpaper change froze the computer).
# -m 8,4: warns below 8 % free, closes one program below 4 %. -s 100,100: zram fills by design, so swap is no condition.
# --prefer: what dies gracefully (browser content processes, JVM and Gradle daemons). --avoid: the desktop, sound,
# browser parents, Tacit's own services. earlyoom reads /etc/default/earlyoom after any Environment=, so the command is
# replaced. systemd splits the words: no spaces or quotes inside the patterns.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 8,4 -s 100,100 -r 0 -n --prefer (^|/)(Isolated.Web.Co|Web.Content|java|kotlin.*|gradle.*)$ --avoid (^|/)(zen|zen-bin|firefox|Hyprland|qs|quickshell|sddm|Xwayland|pipewire|wireplumber|agent-host|flowd|systemd.*|dbus.*)$

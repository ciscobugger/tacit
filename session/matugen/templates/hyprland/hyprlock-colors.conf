# This configuration is generated by matugen
# Changing these variables with matugen still enabled will overwrite them.
# Same surfaces the shell uses: text on_surface, subtext on_surface_variant, the frost is
# surface_container_high at 0.76 (Appearance.colPanelFrost), hairline outline_variant.
# Type is Tacit's own too (tacit-fonts, the shell's default): Inter and Rubik are not installed,
# so hyprlock drew the lock screen in the fontconfig fallback.

$text_color = rgba({{colors.on_surface.default.hex_stripped}}FF)
$subtext_color = rgba({{colors.on_surface_variant.default.hex_stripped}}FF)
$panel_frost = rgba({{colors.surface_container_high.default.hex_stripped}}C2)
$pill = rgba({{colors.surface_container_low.default.hex_stripped}}F2)
$hairline = rgba({{colors.outline_variant.default.hex_stripped}}66)
$entry_background_color = $panel_frost
$entry_border_color = $hairline
$entry_color = rgba({{colors.on_surface.default.hex_stripped}}FF)
$font_family = Tacit Sans
$font_family_clock = Tacit Sans
$font_material_symbols = Material Symbols Rounded

$background_image = {{image}}

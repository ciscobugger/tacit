[Settings]
# Tacit's GTK look for everyone (tacit-session puts it in Tacit's XDG_CONFIG_DIRS); a person's own
# ~/.config/gtk-3.0/settings.ini wins. The values are the owner's (2026-10-16). adw-gtk3-dark is the base matugen's
# generated gtk.css writes the wallpaper's colours for; without it GTK apps fell back to the light default.
# settings.ini is read directly by GTK, with no settings daemon, which this desktop does not run.
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Quiet
gtk-cursor-theme-name=Tacit
gtk-cursor-theme-size=32
gtk-font-name=Tacit Sans 11
gtk-enable-animations=1
gtk-hint-font-metrics=1
# no title bar buttons of the app's own (GTK, libadwaita, Firefox, Chromium and Electron read this): every
# window is closed, hidden and halved by Tacit's window band, the same for every app (2026-10-29)
gtk-decoration-layout=:

# Tacit's kitty configuration for everyone (tacit-session installs it as /etc/xdg/kitty/kitty.conf:
# kitty takes a folder in XDG_CONFIG_DIRS only when the person can write to it, and merges this one
# file under their own), matched to Tacit's foot configuration (/etc/xdg/foot/foot.ini). A person's
# own ~/.config/kitty/kitty.conf overrides it.
# The colours come from the wallpaper (switchwall.sh, tacit.zsh / tacit.fish).

# --- Font -------------------------------------------------------------------
# foot: font=Tacit Mono:size=11,JetBrainsMono Nerd Font:size=11
font_family      Tacit Mono
font_size        11
bold_font        auto
italic_font      auto
bold_italic_font auto

# kitty has no font fallback list, so point Nerd Font glyph ranges at JetBrainsMono Nerd Font Mono
symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F532,U+F0001-U+F1AF0 JetBrainsMono Nerd Font Mono

# --- Padding ----------------------------------------------------------------
# foot: pad=25x25 — inside the window, with no outer margin
window_padding_width 25
window_margin_width  0

# --- Cursor -----------------------------------------------------------------
# foot: style=beam, blink=no
cursor_shape          beam
cursor_blink_interval 0
cursor_trail          0

# --- Transparency / blur ----------------------------------------------------
# foot: alpha=0.85, blur=yes
# dynamic_background_opacity allows OSC 11 alpha escape sequences from switchwall.sh / applycolor.sh
background_opacity         0.85
background_blur            1
dynamic_background_opacity yes

# --- Scrollback -------------------------------------------------------------
# foot: [scrollback] lines=10000
scrollback_lines 10000

# --- Window -----------------------------------------------------------------
remember_window_size    no
confirm_os_window_close 0

# --- Key bindings -----------------------------------------------------------
map ctrl+c       copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map page_up      scroll_page_up
map page_down    scroll_page_down

map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

map ctrl+backspace send_text all \x17

# User overrides, loaded last; silent when missing
globinclude user.conf

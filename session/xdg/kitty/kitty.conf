# Tacit's kitty configuration for everyone (tacit-session installs it as /etc/xdg/kitty/kitty.conf:
# kitty takes a folder in XDG_CONFIG_DIRS only when the person can write to it, and merges this one
# file under their own), matched to Tacit's foot configuration (/etc/xdg/foot/foot.ini). A person's
# own ~/.config/kitty/kitty.conf overrides it.
# The colours come from the wallpaper (switchwall.sh, tacit.zsh / tacit.fish).

# --- Font -------------------------------------------------------------------
# foot: font=Tacit Mono:size=11,JetBrainsMono Nerd Font:size=11
font_family      Tacit Mono
font_size        11
bold_font        auto
italic_font      auto
bold_italic_font auto

# kitty has no font fallback list, so point Nerd Font glyph ranges at JetBrainsMono Nerd Font Mono
symbol_map U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+F000-U+F2E0,U+F300-U+F372,U+F400-U+F532,U+F0001-U+F1AF0 JetBrainsMono Nerd Font Mono

# --- Padding ----------------------------------------------------------------
# foot: pad=25x25 — inside the window, with no outer margin
window_padding_width 25
window_margin_width  0

# --- Cursor -----------------------------------------------------------------
# foot: style=beam, blink=no
cursor_shape          beam
cursor_blink_interval 0
cursor_trail          0

# --- Transparency / blur ----------------------------------------------------
# foot: alpha=0.85, blur=yes
# static, like foot's alpha=: the see-through sequence switchwall.sh writes is foot's ([alpha]#rrggbb), and
# tacit.zsh / tacit.fish leave it out for kitty, so dynamic_background_opacity would have nothing to read
background_opacity 0.85
background_blur    1

# --- Scrollback -------------------------------------------------------------
# foot: [scrollback] lines=10000
scrollback_lines 10000

# --- Window -----------------------------------------------------------------
remember_window_size    no
confirm_os_window_close 0

# --- Key bindings -----------------------------------------------------------
# foot: clipboard-copy=Control+c, clipboard-paste=Control+v, with Control+Shift+c sending an interrupt
map ctrl+c        copy_or_interrupt
map ctrl+shift+c  send_text all \x03
map ctrl+shift+v  paste_from_clipboard

# X11 muscle memory; kitty also keeps shift+insert on the primary selection
map ctrl+insert   copy_to_clipboard
map shift+insert  paste_from_selection

map page_up      scroll_page_up
map page_down    scroll_page_down

# kitty's own: ctrl+shift+t new tab, ctrl+shift+q close tab, ctrl+shift+right / left next / previous tab,
# ctrl+shift+enter split, ctrl+shift+w close split, ctrl+shift+] / [ next / previous split

map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

map ctrl+backspace send_text all \x17

# User overrides, loaded last; a missing file is ignored. kitty resolves a relative include against this file's
# own directory (/etc/xdg/kitty), so the person's file is named in full; include, not globinclude, because kitty
# hands an absolute pattern to Path.glob, which refuses it
include ${HOME}/.config/kitty/user.conf
